name: CI

# Shared libraries for the constellation. :search-core and :search-testkit are pure JVM and
# need no Android SDK; :crash-recovery is an Android library and does. Public repo, so
# GitHub Actions minutes are free.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        # The action's DEFAULT packages input still requests the legacy 'tools' package,
        # which Google's repository no longer serves (sdkmanager exit 1 before Gradle ever
        # runs). Only platform-tools here; the pinned platforms/build-tools install in our
        # own step below. Same fix as android-ide-core's ci.yml (and release-play.yml).
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Pure-JVM modules first: they are the ones every consumer depends on, and they fail
      # fast without needing any Android toolchain at all.
      - name: Search core tests (:search-core:test)
        run: ./gradlew --no-daemon :search-core:test

      - name: Search testkit tests (:search-testkit:test)
        run: ./gradlew --no-daemon :search-testkit:test

      - name: Evidence schema tests (:evidence-schema:test)
        run: ./gradlew --no-daemon :evidence-schema:test

      - name: Crash-recovery tests (:crash-recovery:test)
        run: ./gradlew --no-daemon :crash-recovery:test

      # The opt-in feedback utility. Its tests are the no-hidden-data promise in executable
      # form (the draft renders exactly what it was given), so they gate every push.
      - name: Feedback tests (:feedback:test)
        run: ./gradlew --no-daemon :feedback:test

      # The navigation shell. Its unit tests are the pure motion/mapping maths — the settle
      # curve, the rail's focus falloff, the scrubber's index mapping — which is exactly the
      # part that quietly changes how every app in the constellation feels if it drifts.
      - name: Cell-shell tests (:cell-shell:test)
        run: ./gradlew --no-daemon :cell-shell:test

      # The native chart layer. Robolectric renders every chart (native graphics), so these tests
      # pin the data contract, texture determinism, geometry and the accessibility nodes.
      - name: Viz-kit-android tests (:viz-kit-android:testDebugUnitTest)
        run: ./gradlew --no-daemon :viz-kit-android:testDebugUnitTest

      # Guards the composite-build contract every consumer relies on: the release variant
      # must actually assemble, not just compile under test.
      - name: Assemble crash-recovery release (:crash-recovery:assembleRelease)
        run: ./gradlew --no-daemon :crash-recovery:assembleRelease

      - name: Assemble cell-shell release (:cell-shell:assembleRelease)
        run: ./gradlew --no-daemon :cell-shell:assembleRelease

      - name: Assemble feedback release (:feedback:assembleRelease)
        run: ./gradlew --no-daemon :feedback:assembleRelease

      - name: Assemble viz-kit-android release (:viz-kit-android:assembleRelease)
        run: ./gradlew --no-daemon :viz-kit-android:assembleRelease
