name: CI

# Shared libraries for the constellation. :search-core and :search-testkit are pure JVM and
# need no Android SDK; :crash-recovery is an Android library and does. Public repo, so
# GitHub Actions minutes are free.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Pure-JVM modules first: they are the ones every consumer depends on, and they fail
      # fast without needing any Android toolchain at all.
      - name: Search core tests (:search-core:test)
        run: ./gradlew --no-daemon :search-core:test

      - name: Search testkit tests (:search-testkit:test)
        run: ./gradlew --no-daemon :search-testkit:test

      - name: Crash-recovery tests (:crash-recovery:test)
        run: ./gradlew --no-daemon :crash-recovery:test

      # The navigation shell. Its unit tests are the pure motion/mapping maths — the settle
      # curve, the rail's focus falloff, the scrubber's index mapping — which is exactly the
      # part that quietly changes how every app in the constellation feels if it drifts.
      - name: Cell-shell tests (:cell-shell:test)
        run: ./gradlew --no-daemon :cell-shell:test

      # Diagnostics: percentiles, verdicts, invariants, redaction, report rendering, journal
      # round-trip. Pure JVM, same "fails fast, no Android toolchain needed" reasoning as
      # :search-core above.
      - name: Diagnostics-core tests (:diagnostics-core:test)
        run: ./gradlew --no-daemon :diagnostics-core:test

      # Guards the composite-build contract every consumer relies on: the release variant
      # must actually assemble, not just compile under test.
      - name: Assemble crash-recovery release (:crash-recovery:assembleRelease)
        run: ./gradlew --no-daemon :crash-recovery:assembleRelease

      - name: Assemble cell-shell release (:cell-shell:assembleRelease)
        run: ./gradlew --no-daemon :cell-shell:assembleRelease

      # diagnostics-android/-overlay have no test source of their own (the core is where the
      # logic lives) — assembleRelease is the real gate: does the module actually build against
      # a real Android SDK, which no JVM check can answer. diagnostics-android's debug variant is
      # assembled too (not just release) because the no-INTERNET-permission check below asserts
      # against the MERGED manifest of both variants — the debug one is where the FileProvider
      # actually lives.
      - name: Assemble diagnostics-android debug + release
        run: ./gradlew --no-daemon :diagnostics-android:assembleDebug :diagnostics-android:assembleRelease

      - name: Assemble diagnostics-overlay release (:diagnostics-overlay:assembleRelease)
        run: ./gradlew --no-daemon :diagnostics-overlay:assembleRelease

      - name: Assemble diagnostics-noop release (:diagnostics-noop:assembleRelease)
        run: ./gradlew --no-daemon :diagnostics-noop:assembleRelease

      # scripts/check-noop-parity.py asserts diagnostics-noop mirrors diagnostics-android
      # function-for-function and parameter-for-parameter — signature drift must fail here, not
      # later in someone's release build.
      - name: Diagnostics noop/android API parity
        run: python3 scripts/check-noop-parity.py

      # The README's and spec's central privacy claim — "no network permission, ever" — is only
      # actually verified by inspecting the MERGED manifest AGP produces, not the source one this
      # repo authors: a dependency's own manifest could in principle contribute a permission that
      # never appears in diagnostics-android/src/main/AndroidManifest.xml. This checks the real
      # build output.
      - name: Diagnostics-android has no manifest permissions (debug or release)
        run: python3 scripts/check-no-internet-permission.py
