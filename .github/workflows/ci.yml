name: CI

# Shared-Libraries-asoc: JVM/Android library modules, no native build. Public repo, so
# GitHub Actions minutes are free. Uses `gradle` directly (via setup-gradle's pinned
# version) rather than `./gradlew`, since this repo's wrapper jar isn't committed yet --
# see README. setup-gradle provisions a working Gradle binary either way.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Crash-recovery tests
        run: gradle --no-daemon :crash-recovery:test
      - name: Crash-recovery release AAR
        run: gradle --no-daemon :crash-recovery:assembleRelease
