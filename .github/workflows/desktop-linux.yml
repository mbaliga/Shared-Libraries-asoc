name: Desktop (Linux)

# The pure-JVM modules on hosted Linux runners (x86_64 and arm64). No artifacts are uploaded.
# This does not build or test the Android modules, and says nothing about Linux UI or device
# behaviour: it is CI (hosted VM) evidence only, never device evidence.
#
# TODO: pin each `uses:` to a full commit SHA. Tags are used for now because the SHAs could not
# be resolved when this file was written; do not invent them.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-linux-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM module tests
        run: ./gradlew --no-daemon :search-core:test :evidence-schema:test

  # The arm64 runner is free only for public repositories (OQ-20), so it is skipped on a
  # private repo.
  jvm-linux-arm:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM module tests
        run: ./gradlew --no-daemon :search-core:test :evidence-schema:test
