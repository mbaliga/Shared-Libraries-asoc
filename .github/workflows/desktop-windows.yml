name: Desktop Windows

# PORTING_PLAN.md S0.1 - JVM leg on Windows, after the path lint (R3). Runs ONLY while the repository
# is public (OQ-20: private repositories get Linux lanes only), so every job is guarded by
# `github.event.repository.private == false`. Hosted-VM evidence only: the Dell stays a device gate
# until it leaves Windows (OQ-5).
#
# Gradle is invoked through gradlew.bat (cmd), not the POSIX gradlew script: a Windows checkout may
# rewrite gradlew to CRLF line endings, which breaks its shebang under bash.
# No Android SDK is installed on purpose. PORTING_PLAN.md S0.1 left open "whether this build
# configures without one"; observed in the planning container (Gradle 8.14.3, AGP 8.9.1, no
# ANDROID_HOME): `:search-core:test` configures and runs all of its tests with no SDK and no
# --configure-on-demand. If a runner image behaves differently this lane goes red and the S0.1
# note in PORTING_PLAN.md needs updating (the fallback is to install the SDK as ci.yml does).
#
# New file only: ci.yml is untouched (R3). Nothing is uploaded (R6: Actions artifact storage is
# exhausted). Actions are pinned by commit SHA; the version is in the trailing comment.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R3: a Windows-checkout path lint must pass before any windows-* (or case-insensitive macOS)
  # lane runs. It reads `git ls-files`, so it needs no OS-specific runner.
  path-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Path lint self-test (scripts/test-windows-path-lint.sh)
        run: bash scripts/test-windows-path-lint.sh
      - name: Path lint (scripts/windows-path-lint.sh)
        run: bash scripts/windows-path-lint.sh

  jvm-tests:
    needs: path-lint
    runs-on: windows-2025
    timeout-minutes: 45
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # :search-core is pure JVM and always present. :evidence-schema exists on `main` but not on
      # every line of this repo, so it is added only when settings.gradle.kts includes it. That
      # keeps this file valid on both lines and the eventual merge clean.
      - name: Choose test tasks
        shell: bash
        run: |
          tasks=":search-core:test"
          if grep -q 'include(":evidence-schema")' settings.gradle.kts; then
            tasks="$tasks :evidence-schema:test"
          fi
          echo "TASKS=$tasks" >> "$GITHUB_ENV"
          echo "Running: $tasks"

      - name: JVM tests (windows)
        shell: cmd
        run: gradlew.bat --no-daemon %TASKS%
