name: Foundation checks
# Checks for the modules that are not part of the root Gradle build (kmp-conventions,
# platform-ports) and for the packaging templates. Linux only, read-only, no artifact uploads.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kmp-conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: LANG=C.UTF-8 LC_ALL=C.UTF-8 ./kmp-conventions/verify.sh
  platform-ports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: cd platform-ports && LANG=C.UTF-8 LC_ALL=C.UTF-8 gradle --no-daemon jvmTest
  packaging-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python3 -I packaging/lint.py
