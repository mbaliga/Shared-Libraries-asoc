<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>ASOC Viz Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap">
<style>
/* Layout: loud grounds in a bento at the top, then the whole vocabulary as a masonry of quiet cards sized to their charts. */
:root {
  --page: #e3e1db; --wash-a: rgba(246, 238, 45, .34); --wash-b: rgba(255, 143, 76, .2);
  --fg: #111110; --muted: #5d5b55; --card: #efede8; --line: rgba(17, 17, 16, .13);
  --code-bg: #111110; --code-fg: #ecebe6;
  --display: "Outfit", "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", monospace;
  --r: 26px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #07070a; --wash-a: rgba(204, 236, 117, .07); --wash-b: rgba(142, 123, 255, .09);
  --fg: #ecebe6; --muted: #9a988f; --card: #131316; --line: rgba(236, 235, 230, .15);
  --code-bg: #1b1b1f; --code-fg: #ecebe6; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #07070a; --wash-a: rgba(204, 236, 117, .07); --wash-b: rgba(142, 123, 255, .09);
  --fg: #ecebe6; --muted: #9a988f; --card: #131316; --line: rgba(236, 235, 230, .15);
  --code-bg: #1b1b1f; --code-fg: #ecebe6; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html { scroll-behavior: smooth }
body {
  margin: 0; background: var(--page); color: var(--fg); font: 300 16px/1.45 var(--display);
  background-image: radial-gradient(60rem 34rem at 0% 0%, var(--wash-a), transparent 70%), radial-gradient(50rem 30rem at 70% 0%, var(--wash-b), transparent 70%);
  background-repeat: no-repeat;
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 36px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 18px }
h1 { margin: 0; font-weight: 300; font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1; letter-spacing: -.02em }
.sub { margin: 10px 0 0; color: var(--muted); font-size: .8rem }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--line); gap: 2px }
.seg button, .chip { font: inherit; font-size: .78rem; font-weight: 400; color: var(--fg); background: none; border: 0; padding: 7px 15px; border-radius: 999px; cursor: pointer; white-space: nowrap }
.chip { border: 1px solid var(--line) }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--fg); color: var(--page); border-color: var(--fg) }
button:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid currentColor; outline-offset: 2px }
nav { display: flex; flex-wrap: wrap; gap: 4px 2px; margin: 0 0 22px -10px }
nav a { color: var(--muted); text-decoration: none; font-size: .82rem; padding: 4px 10px; border-radius: 999px }
nav a:hover { color: var(--fg) }
nav a span { opacity: .6; font-variant-numeric: tabular-nums; margin-left: .35em }

section.sec { margin-top: 34px; scroll-margin-top: 16px }
section.sec > h2 { margin: 0 0 12px; font-size: 1.5rem; font-weight: 300; letter-spacing: -.01em }
section.sec > h2 small { font-size: .78rem; color: var(--muted); margin-left: .6em; font-weight: 300 }
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px }
.bento .card { grid-column: span var(--span, 12) }
.gal { columns: 3 330px; column-gap: 10px }
.gal .card { break-inside: avoid; margin: 0 0 10px; display: flex }
.gal .card.wide { column-span: all }

.card { --g: var(--card); --i: var(--fg); min-width: 0; background: var(--g); color: var(--i); border-radius: var(--r); padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden }
.card > .head { display: flex; align-items: center; gap: 6px }
.card h3 { margin: 0 auto 0 0; font-size: 1.02rem; font-weight: 400; min-width: 0 }
.card h3 small { font-size: .72rem; font-weight: 300; opacity: .7; margin-left: .5em }
.ib { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; color: var(--i); background: color-mix(in srgb, var(--i) 9%, transparent); display: grid; place-items: center; font: 400 .8rem var(--display) }
.ib[aria-pressed="true"] { background: var(--i); color: var(--g) }
.vars { display: flex; flex-wrap: wrap; gap: 5px }
.vars button { font: inherit; font-size: .72rem; font-weight: 400; color: var(--i); background: color-mix(in srgb, var(--i) 9%, transparent); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer }
.vars button[aria-pressed="true"] { background: var(--i); color: var(--g) }
.body { min-width: 0; display: flex; flex-direction: column; gap: 14px; flex: 1 }
.plot { min-width: 0 }
.flush { padding-bottom: 0 }
.flush .body { justify-content: flex-end }
.fanwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: end }
.fanwrap .legend { padding-bottom: 20px }
.fanwrap .plot { height: 190px; margin-right: -20px }
.code { margin: 0; background: color-mix(in srgb, var(--i) 92%, transparent); color: var(--g); border-radius: 14px; padding: 12px 14px; overflow-x: auto; font: 400 .72rem/1.55 var(--mono); white-space: pre }
.card table { border-collapse: collapse; width: 100%; font-size: .76rem; font-variant-numeric: tabular-nums }
.card th, .card td { text-align: left; font-weight: 300; padding: 4px 12px 4px 0; border-bottom: 1px solid color-mix(in srgb, var(--i) 14%, transparent); white-space: nowrap }
.card thead th { font-weight: 400; opacity: .7 }
.card td { text-align: right; padding-right: 0 }
.card td:not(:last-child) { padding-right: 12px }
.tbl { overflow: auto; max-height: 320px }
.gantt { overflow-x: auto }
.vocab { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px }
.vocab figure { margin: 0; min-width: 0 }
.vocab svg.tile { display: block; width: 100%; height: 70px; border-radius: 14px }
.vocab figcaption, .keys span { font-size: .72rem; margin-top: 7px; display: flex; gap: .5em }
.vocab figcaption i { font-style: normal; opacity: .55; font-variant-numeric: tabular-nums }
.keys { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center }
.keys > div { display: flex; align-items: center; gap: 8px }
.keys span { margin: 0 }
.keys b { font-weight: 400; font-size: .78rem; opacity: .6; margin-right: 2px }
footer { margin-top: 40px; color: var(--muted); font-size: .78rem }

@media (max-width: 960px) { .bento .card { --span: 6 !important } .bento .card.wide { --span: 12 !important } .vocab { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
@media (max-width: 620px) { .bento .card { --span: 12 !important } :root { --r: 22px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } html { scroll-behavior: auto } }
</style>
<!--/page-->
</head>
<body>
<!--page-->
<div class="wrap">
  <header>
    <div>
      <h1>Viz kit</h1>
      <p class="sub">ASOC.viz <span id="ver"></span> · <span id="count"></span> charts · example data</p>

    <div class="ctl">
      <div class="seg" role="group" aria-label="Grounds">

  </header>
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>

</div>
